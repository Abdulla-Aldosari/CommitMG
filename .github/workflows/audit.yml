name: Security Audit

on:
  push:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9:00 AM UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
